<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Overlay Blindtest Été 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Audiowide&display=swap" rel="stylesheet">

<style>

:root{--cyan:#28f7ff;--pink:#ff2dac;--violet:#7b2cff}*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent;font-family:"Orbitron",sans-serif}.overlay{width:1920px;height:1080px;position:relative;background:radial-gradient(circle at 50% 20%,rgba(255,72,150,.28),transparent 25%),linear-gradient(180deg,rgba(5,4,25,.78),rgba(3,8,25,.5))}.overlay::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.022) 0 1px,transparent 1px 5px);pointer-events:none}.title{position:absolute;top:24px;left:50%;transform:translateX(-50%) skewX(-5deg);width:760px;padding:12px;text-align:center;clip-path:polygon(4% 0,96% 0,100% 50%,96% 100%,4% 100%,0 50%);background:linear-gradient(100deg,rgba(10,7,39,.94),rgba(65,13,83,.92),rgba(8,10,38,.94));border:1px solid var(--cyan);box-shadow:0 0 18px var(--cyan),0 0 34px var(--pink)}.title h1{margin:0;font-family:"Audiowide";font-size:42px;letter-spacing:5px;background:linear-gradient(#fff,#ff73cd 55%,#7027ff);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 0 8px var(--pink))}.blindtest,.chat{position:absolute;top:116px;height:830px;border-radius:14px;background:rgba(4,8,28,.76);backdrop-filter:blur(6px)}.blindtest{left:34px;width:1440px;border:2px solid var(--cyan);box-shadow:0 0 18px var(--cyan),inset 0 0 22px rgba(40,247,255,.15)}.chat{right:34px;width:400px;border:2px solid var(--pink);box-shadow:0 0 18px var(--pink),inset 0 0 22px rgba(255,45,172,.14);overflow:hidden}.chat iframe{width:100%;height:100%;border:0}.footer{position:absolute;left:34px;right:34px;bottom:28px;height:72px;border:1px solid var(--cyan);border-radius:10px;background:linear-gradient(90deg,rgba(8,13,42,.9),rgba(42,10,62,.88));box-shadow:0 0 14px rgba(40,247,255,.65);display:flex;align-items:center;justify-content:center;gap:55px;color:#fff;letter-spacing:2px}.footer span:nth-child(odd){color:var(--cyan);text-shadow:0 0 8px var(--cyan)}.footer span:nth-child(even){color:#ff8ad7;text-shadow:0 0 8px var(--pink)}

</style>
</head>

<body>

<div class="overlay">
  <div class="header-decor left"><span class="sun"></span><span class="palm">🌴</span><span class="ball"></span><span class="wave">≈≈≈</span></div>
  <div class="header-decor right"><span class="sun"></span><span class="palm">🌴</span><span class="ball"></span><span class="wave">≈≈≈</span></div>

  <img class="summer-mascot" src="./eter-chien-ete.png" alt="Eter et son chien en mode été">

  <div class="title">
    <h1>BLINDTEST ÉTÉ 2026</h1>
  </div>

  <!-- BLINDTEST ZONE -->
  <div class="blindtest"></div>

  <!-- CHAT TWITCH INTÉGRÉ -->
  <div class="chat">
    <iframe
      src="https://www.twitch.tv/embed/eterzx/chat?parent=etezx.github.io&darkpopout=true"
    ></iframe>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <span>● LIVE BLINDTEST</span>
    <span>● SUMMER PARTY</span>
    <span>● ÉDITION ÉTÉ 2026</span>
  </div>

</div>

</body>
</html>
