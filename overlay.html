<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Overlay Blindtest Été 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Audiowide&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: transparent;
  font-family: "Orbitron", sans-serif;
}

.overlay {
  width: 1920px;
  height: 1080px;
  position: relative;
}

/* TITLE */
.title {
  position: absolute;
  top: 30px;
  left: 50%;
  transform: translateX(-50%);
  padding: 15px 40px;
  border-radius: 50px;
  background: linear-gradient(135deg, rgba(5,55,70,0.82), rgba(255,138,91,0.28));
  border: 1px solid #ff8a5b;
  box-shadow: 0 0 20px #ff8a5b, 0 0 40px #19e0cf33;
  text-align: center;
}

.title h1 {
  margin: 0;
  font-family: "Audiowide";
  font-size: 36px;
  letter-spacing: 6px;
  color: white;
  text-shadow: 0 0 10px #ff8a5b, 0 0 20px #19e0cf;
}

/* BLINDTEST FRAME */
.blindtest {
  position: absolute;
  left: 34px;
  top: 120px;
  width: 1450px;
  height: 840px;
  border-radius: 20px;
  border: 2px solid #19e0cf;
  box-shadow: 0 0 20px #19e0cf, 0 0 40px #ff8a5b33;
  overflow: hidden;
}

/* CHAT FRAME */
.chat {
  position: absolute;
  right: 34px;
  top: 120px;
  width: 400px;
  height: 840px;
  border-radius: 20px;
  border: 2px solid #ff8a5b;
  box-shadow: 0 0 20px #ff8a5b, 0 0 40px #19e0cf33;
  overflow: hidden;
}

/* TWITCH CHAT */
.chat iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* FOOTER */
.footer {
  position: absolute;
  left: 34px;
  right: 34px;
  bottom: 34px;
  height: 70px;
  border-radius: 15px;
  background: linear-gradient(90deg, rgba(5,55,70,0.80), rgba(0,120,130,0.62));
  border: 1px solid #19e0cf;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 30px;
  color: white;
}

.footer span {
  color: #19e0cf;
}


/* SUMMER MASCOT */
.summer-mascot {
  position: absolute;
  top: 18px;
  right: 40px;
  width: 205px;
  height: 92px;
  object-fit: cover;
  object-position: center 24%;
  border-radius: 22px;
  border: 2px solid #ffd66f;
  box-shadow: 0 0 16px #ff8a5b, 0 0 28px rgba(25,224,207,.45);
  z-index: 4;
}

/* BACKGROUND FX */
body::before {
  content: "";
  position: fixed;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle at 20% 20%, rgba(255,216,107,0.28), transparent 35%),
              radial-gradient(circle at 80% 25%, rgba(255,138,91,0.22), transparent 35%),
              radial-gradient(circle at 50% 85%, rgba(25,224,207,0.22), transparent 40%);
  animation: moveBg 12s linear infinite;
  z-index: -1;
}

@keyframes moveBg {
  0% { transform: translate(0,0); }
  50% { transform: translate(-20%,10%); }
  100% { transform: translate(0,0); }
}
</style>
</head>

<body>

<div class="overlay">

  <img class="summer-mascot" src="./eter-chien-ete.png" alt="Eter et son chien en mode été">

  <div class="title">
    <h1>BLINDTEST ÉTÉ 2026</h1>
  </div>

  <!-- BLINDTEST ZONE -->
  <div class="blindtest"></div>

  <!-- CHAT TWITCH INTÉGRÉ -->
  <div class="chat">
    <iframe
      src="https://www.twitch.tv/embed/eterzx/chat?parent=etezx.github.io&darkpopout=true"
    ></iframe>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <span>● LIVE BLINDTEST</span>
    <span>● SUMMER PARTY</span>
    <span>● ÉDITION ÉTÉ 2026</span>
  </div>

</div>

</body>
</html>
