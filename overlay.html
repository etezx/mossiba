<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Overlay Blindtest Été 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Audiowide&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  background: transparent;
  font-family: "Orbitron", sans-serif;
}

.overlay {
  width: 1920px;
  height: 1080px;
  position: relative;
}

/* TITLE */
.title {
  position: absolute;
  top: 30px;
  left: 50%;
  transform: translateX(-50%);
  padding: 15px 40px;
  border-radius: 50px;
  background: linear-gradient(135deg, rgba(5,55,70,0.82), rgba(255,138,91,0.28));
  border: 1px solid #ff8a5b;
  box-shadow: 0 0 20px #ff8a5b, 0 0 40px #19e0cf33;
  text-align: center;
}

.title h1 {
  margin: 0;
  font-family: "Audiowide";
  font-size: 36px;
  letter-spacing: 6px;
  color: white;
  text-shadow: 0 0 10px #ff8a5b, 0 0 20px #19e0cf;
}

/* BLINDTEST FRAME */
.blindtest {
  position: absolute;
  left: 34px;
  top: 120px;
  width: 1450px;
  height: 840px;
  border-radius: 20px;
  border: 2px solid #19e0cf;
  box-shadow: 0 0 20px #19e0cf, 0 0 40px #ff8a5b33;
  overflow: hidden;
}

/* CHAT FRAME */
.chat {
  position: absolute;
  right: 34px;
  top: 120px;
  width: 400px;
  height: 840px;
  border-radius: 20px;
  border: 2px solid #ff8a5b;
  box-shadow: 0 0 20px #ff8a5b, 0 0 40px #19e0cf33;
  overflow: hidden;
}

/* TWITCH CHAT */
.chat iframe {
  width: 100%;
  height: 100%;
  border: none;
}

/* FOOTER */
.footer {
  position: absolute;
  left: 34px;
  right: 34px;
  bottom: 34px;
  height: 70px;
  border-radius: 15px;
  background: linear-gradient(90deg, rgba(5,55,70,0.80), rgba(0,120,130,0.62));
  border: 1px solid #19e0cf;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 30px;
  color: white;
}

.footer span {
  color: #19e0cf;
}


/* SUMMER MASCOT */
.summer-mascot {
  position: absolute;
  top: 18px;
  right: 40px;
  width: 205px;
  height: 92px;
  object-fit: cover;
  object-position: center 24%;
  border-radius: 22px;
  border: 2px solid #ffd66f;
  box-shadow: 0 0 16px #ff8a5b, 0 0 28px rgba(25,224,207,.45);
  z-index: 4;
}

/* BACKGROUND FX */
body::before {
  content: "";
  position: fixed;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle at 20% 20%, rgba(255,216,107,0.28), transparent 35%),
              radial-gradient(circle at 80% 25%, rgba(255,138,91,0.22), transparent 35%),
              radial-gradient(circle at 50% 85%, rgba(25,224,207,0.22), transparent 40%);
  animation: moveBg 12s linear infinite;
  z-index: -1;
}

@keyframes moveBg {
  0% { transform: translate(0,0); }
  50% { transform: translate(-20%,10%); }
  100% { transform: translate(0,0); }
}


/* ===== SUMMER OVERLAY V2 ===== */
body {
  overflow: hidden;
  background:
    linear-gradient(180deg, rgba(1,24,35,.56), rgba(1,52,62,.28) 58%, rgba(255,148,57,.34)),
    url("./eter-chien-ete.png") center / cover no-repeat fixed;
}

body::before {
  width: 100%;
  height: 100%;
  animation: none;
  background:
    linear-gradient(180deg, rgba(0,25,37,.70), rgba(0,66,74,.55) 55%, rgba(255,145,50,.50)),
    radial-gradient(circle at 14% 80%, rgba(255,212,71,.34), transparent 24%),
    radial-gradient(circle at 85% 15%, rgba(255,77,184,.24), transparent 24%);
}

.overlay::before,
.overlay::after {
  content: "";
  position: absolute;
  width: 330px;
  height: 330px;
  top: -70px;
  background:
    radial-gradient(ellipse at 40% 40%, #177a42 0 13%, transparent 14%),
    radial-gradient(ellipse at 62% 32%, #0f6138 0 14%, transparent 15%),
    radial-gradient(ellipse at 52% 58%, #249452 0 15%, transparent 16%);
  opacity: .65;
  pointer-events: none;
  z-index: 3;
}
.overlay::before { left: -80px; transform: rotate(-18deg); }
.overlay::after { right: -70px; transform: rotate(22deg) scaleX(-1); }

.title {
  top: 18px;
  padding: 16px 64px 18px;
  border-radius: 18px;
  background:
    linear-gradient(rgba(79,35,19,.94), rgba(45,20,13,.96)),
    repeating-linear-gradient(90deg, transparent 0 95px, rgba(255,255,255,.05) 95px 97px);
  border: 3px solid #d9893b;
  box-shadow: 0 9px 0 rgba(52,22,13,.68), 0 0 25px rgba(255,212,71,.60), 0 0 35px rgba(0,240,232,.25);
  transform: translateX(-50%) rotate(-.5deg);
  z-index: 5;
}
.title h1 {
  font-size: 42px;
  color: #fff5d3;
  text-shadow: 0 3px 0 #a6422a, 0 0 12px #ff4db8, 0 0 22px #00e8df;
}
.title h1::before, .title h1::after { content: "🌺"; margin: 0 14px; }

.blindtest, .chat {
  top: 128px;
  height: 820px;
  border-width: 3px;
  background: linear-gradient(180deg, rgba(2,46,58,.74), rgba(1,26,38,.78));
  box-shadow: 0 0 0 6px rgba(0,0,0,.22), inset 0 0 34px rgba(0,217,210,.10), 0 0 25px rgba(82,255,241,.70);
}
.blindtest { border-color: #52fff1; }
.chat { border-color: #ff5d9f; box-shadow: 0 0 0 6px rgba(0,0,0,.22), inset 0 0 34px rgba(255,77,184,.10), 0 0 25px rgba(255,77,184,.66); }

.blindtest::before,
.chat::before,
.footer::before {
  content: "";
  position: absolute;
  inset: 8px;
  border: 1px solid rgba(255,212,71,.38);
  border-radius: 14px;
  pointer-events: none;
  z-index: 2;
}

.summer-mascot {
  top: 18px;
  right: 46px;
  width: 210px;
  height: 96px;
  border-radius: 22px;
  border: 3px solid #ffd447;
  box-shadow: 0 0 18px #ff8a2a, 0 0 28px rgba(0,232,223,.52);
  object-position: center 35%;
  z-index: 6;
}

.footer {
  bottom: 26px;
  height: 82px;
  border: 2px solid #00e8df;
  border-radius: 22px;
  background: linear-gradient(180deg, rgba(2,45,57,.95), rgba(0,24,36,.97));
  box-shadow: 0 0 24px rgba(0,232,223,.62), 0 0 32px rgba(255,77,184,.25);
  font-family: "Audiowide", cursive;
  letter-spacing: 2px;
  position: absolute;
}
.footer span:nth-child(1) { color: #52fff1; }
.footer span:nth-child(2) { color: #ffd447; }
.footer span:nth-child(3) { color: #ff75b8; }



/* SUMMER ANIMATED HEADER DECOR V4 */
.header-decor { position:absolute; top:5px; width:360px; height:105px; z-index:5; pointer-events:none; }
.header-decor.left { left:28px; }
.header-decor.right { right:270px; transform:scaleX(-1); }
.header-decor .sun { position:absolute;left:0;top:15px;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle,#fffbd0 0 15%,#ffd447 35%,#ff8a2a 66%,transparent 69%);box-shadow:0 0 28px #ffd447;animation:oSun 2.5s ease-in-out infinite; }
.header-decor .palm { position:absolute;left:68px;top:-8px;font-size:88px;transform-origin:45% 90%;animation:oPalm 4s ease-in-out infinite; }
.header-decor .ball { position:absolute;left:190px;top:32px;width:48px;height:48px;border-radius:50%;background:conic-gradient(#ff5d73 0 20%,#fff 20% 40%,#00d9d2 40% 60%,#fff 60% 80%,#ffd447 80%);border:2px solid white;animation:oBall 3s ease-in-out infinite;box-shadow:0 0 16px rgba(255,93,115,.7); }
.header-decor .wave { position:absolute;left:255px;top:48px;color:#9bfff7;font-size:32px;text-shadow:0 0 10px #00e8df;animation:oWave 2.2s ease-in-out infinite; }
@keyframes oSun {50%{transform:scale(1.12)}}
@keyframes oPalm {50%{transform:rotate(5deg)}}
@keyframes oBall {50%{transform:translateY(-12px) rotate(150deg)}}
@keyframes oWave {50%{transform:translateY(-6px);opacity:.6}}

</style>
</head>

<body>

<div class="overlay">
  <div class="header-decor left"><span class="sun"></span><span class="palm">🌴</span><span class="ball"></span><span class="wave">≈≈≈</span></div>
  <div class="header-decor right"><span class="sun"></span><span class="palm">🌴</span><span class="ball"></span><span class="wave">≈≈≈</span></div>

  <img class="summer-mascot" src="./eter-chien-ete.png" alt="Eter et son chien en mode été">

  <div class="title">
    <h1>BLINDTEST ÉTÉ 2026</h1>
  </div>

  <!-- BLINDTEST ZONE -->
  <div class="blindtest"></div>

  <!-- CHAT TWITCH INTÉGRÉ -->
  <div class="chat">
    <iframe
      src="https://www.twitch.tv/embed/eterzx/chat?parent=etezx.github.io&darkpopout=true"
    ></iframe>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <span>● LIVE BLINDTEST</span>
    <span>● SUMMER PARTY</span>
    <span>● ÉDITION ÉTÉ 2026</span>
  </div>

</div>

</body>
</html>
